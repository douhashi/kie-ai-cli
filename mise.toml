# 開発環境の SSoT。`mise install` でツールを入れ、`mise run setup` で使える状態にする。
# 手順は docs/development/setup.md。

[tools]
# 本体の実装言語。単一バイナリを cgo 無しでビルドする。
go = "1.26.7"
# git hooks ランナー。`mise run setup` が .git/hooks へ導入する。
lefthook = "1.13.6"
# シークレット注入。kie.ai の API キーは Infisical から `infisical run` で渡す。
infisical = "0.43.125"

[env]
# Go 自身の toolchain 自動取得を止める。放置すると go.mod の要求に応じて
# 別版を勝手に落としてきて、[tools] の pin が実質無効になる。
GOTOOLCHAIN = "local"

[tasks.setup]
description = "git hooks を導入し、開発を始められる状態にする"
run = ["lefthook install"]

[tasks.lint]
description = "ドキュメントの書式契約と Go の静的検査を通す"
# 書式の定義は docs/document_system/templates/。上限が無いと各変更の
# 「もう一言だけ足す」が複利で膨らむため、機械的に落とす。
# Python 3 標準ライブラリのみで動き、この検査自体は追加の依存を持たない。
run = [
  "python3 scripts/check-docs-format.py",
  # gofmt は対象を並べるだけで終了コードを立てないため、出力の空判定で落とす。
  'test -z "$(gofmt -l .)" || { echo "gofmt 未適用:" >&2; gofmt -l . >&2; exit 1; }',
  "go vet ./...",
]

[tasks.test]
description = "Go のテストを走らせる"
# ビルドと同じく cgo 無しで走らせる。SQLite は pure Go 実装なので、
# ここで cgo が要るようになったら依存の入れ替わりを疑う。
# 外部 API を叩く疎通テストは `e2e` タグで分離してあり、ここには入らない。
# 実行は `infisical run -- go test -tags e2e ./...`（docs/development/setup.md）。
run = ["CGO_ENABLED=0 go test ./..."]

[tasks.catalog]
description = "docs.kie.ai を巡回して internal/catalog/catalog.json を再生成する"
# 231 ページを取りに行くので同時実行数を絞る。開発中に何度も回すときは
# `mise run catalog -- --pages-dir .tmp/catalog-pages` でページを再利用する。
run = ["go run ./cmd/catalog-gen"]

[tasks.build]
description = "手元の OS/アーキテクチャ向けに単一バイナリをビルドする"
# cgo を切って外部 C ライブラリへの動的リンクを排し、-trimpath で
# 成果物にビルド環境の絶対パスを残さない。
run = ["CGO_ENABLED=0 go build -trimpath -o dist/kie-ai-cli ."]

[tasks.build-all]
description = "配布対象の 3 OS 向けにクロスビルドし、成果物を検査してチェックサムを作る"
# ビルドが通っただけでは「カタログを焼き込んだ cgo 無しの単一バイナリ」を
# 満たしたか分からないので、成果物の存在・記録された CGO_ENABLED・
# カタログの焼き込みをこのタスク自身で確認して落とす。
#
# 公開する成果物を作るのもこのタスクである（.github/workflows/release.yml は
# KIE_AI_VERSION を渡して呼ぶだけ）。版の焼き込みもチェックサムの生成も
# ここに置くことで、PR の CI が毎回同じ経路を通り、リリース手順だけが
# タグを打つまで未検証で残ることがなくなる。
run = """
set -eu
# 版は Release だけが名乗る。手元と PR のビルドでは空のままで、
# 成果物は従来どおり Go ツールチェーンが記録した版を返す。
version="${KIE_AI_VERSION:-}"
ldflags=""
if [ -n "$version" ]; then
  ldflags="-X github.com/douhashi/kie-ai-cli/internal/cli.releaseVersion=$version"
fi
# クロスビルドした成果物は動かせないが、手元の OS/アーキ向けの 1 つだけは
# 動かせる。焼き込みの検査を文字列の一致で終わらせないために使う。
host_goos=$(go env GOOS)
host_goarch=$(go env GOARCH)
for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
  goos="${target%/*}"
  goarch="${target#*/}"
  out="dist/kie-ai-cli_${goos}_${goarch}"
  if [ "$goos" = windows ]; then out="${out}.exe"; fi
  CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "$out" .
  if [ ! -f "$out" ]; then
    echo "成果物がありません: $out" >&2
    exit 1
  fi
  if ! go version -m "$out" | grep -q '^	build	CGO_ENABLED=0$'; then
    echo "cgo が有効なままです: $out" >&2
    exit 1
  fi
  # ビルドが通ってもカタログの焼き込みは落ちうる（#3 はここを見ておらず素通りした）。
  # 既知のモデル ID が成果物の中に現れることを、成果物そのものに対して確認する。
  # -a を付けるのは、grep 実装によってはバイナリ中の一致を報告せず
  # 「焼き込まれているのに落ちる」ためで、テキストとして走査させる。
  if ! grep -qa "bytedance/seedream-v4-text-to-image" "$out"; then
    echo "モデルカタログが焼き込まれていません: $out" >&2
    exit 1
  fi
  # 補完の索引は別ファイルで、焼き込みも別の embed である。カタログが入って
  # いても索引が抜けうるので、索引の 1 行として成果物の中を確認する。
  # タブを含むため printf で作る（$'\\t' は sh に無い）。
  index_line=$(printf 'bytedance/seedream-v4-text-to-image\\timage\\tseedream')
  if ! grep -qa "$index_line" "$out"; then
    echo "補完の索引が焼き込まれていません: $out" >&2
    exit 1
  fi
  # 版を渡されたなら、5 つすべてに入っていること。-X は綴りを間違えた
  # シンボルを黙って捨てるので、ビルドが通ったことは焼き込みの証拠にならない。
  if [ -n "$version" ] && ! grep -qa "$version" "$out"; then
    echo "版が焼き込まれていません: $out" >&2
    exit 1
  fi
  # ただし文字列の一致だけでは足りない。依存の版（go.sum の v1.0.0 等）が
  # 成果物に記録されており、タグ名と偶然一致しうる。動かせる 1 つについては
  # --version が実際にそれを返すところまで確かめる。
  if [ "$goos" = "$host_goos" ] && [ "$goarch" = "$host_goarch" ]; then
    reported=$("$out" --version)
    if [ -z "$reported" ]; then
      echo "--version が何も返しません: $out" >&2
      exit 1
    fi
    if [ -n "$version" ] && [ "$reported" != "$version" ]; then
      echo "--version が版を返しません: $reported (期待は $version)" >&2
      exit 1
    fi
  fi
  echo "ok $out"
done
# 取得側が dist/ の中で `sha256sum -c checksums.txt` をそのまま回せるよう、
# 名前は dist/ からの相対にする。macOS には sha256sum が無いので shasum に落ちる。
# `mise run build` の dist/kie-ai-cli は配布物ではないので glob から外れる。
(
  cd dist
  if command -v sha256sum >/dev/null 2>&1; then
    sha256sum kie-ai-cli_* > checksums.txt
  else
    shasum -a 256 kie-ai-cli_* > checksums.txt
  fi
)
echo "ok dist/checksums.txt"
"""
